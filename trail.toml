sitename = "Peios Learn"
title = "Documentation for everything Peios"
url = "https://learn.peios.org"
accent = "#3b82f6"
description = "Concepts, guides, and reference for the Peios operating system and other Peios-branded software."
footer = "Peios Learn — documentation for Peios software."

featured = [
  "peios", "kernel", "universal-directory", "project", "trail", "acta",
  "provium", "clackatoo", "gcsl", "psc", "specifications", "framewright",
]
edit_url = "https://github.com/peios/learn/edit/main/{path}"
passthrough = ["CNAME", ".well-known"]

[[attachments]]
id = "psc-style-tooling"
title = "PSC Style Tooling"
description = "Pinned style configurations, setup scripts, and qualification fixtures."
source = "download-sources/psc-style-tooling"
filename = "psc-style-tooling.tar.gz"
format = "tar.gz"
exclude = [".venv", "node_modules", ".bin", ".cache", "results", ".git", "__pycache__", "scripts/__pycache__"]

# Each tree is used from its local checkout at `path` when that exists, and
# fetched from `repo` otherwise, as in CI. The kernel's plugins read its
# source, so it needs the whole repository.
