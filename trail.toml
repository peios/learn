# Core Style's mechanical rules, checked by `trail lint`. See Trail's
# "Checking style" page for every rule and how to suppress one.
[lint]
rules = [
  "spelling", "em-dash", "double-hyphen", "curly-quotes",
  "invisible-characters", "exclamation", "ampersand", "double-space",
  "title-case", "heading-case", "heading-punctuation", "heading-levels",
  "code-language", "shell-prompt", "line-length", "hex-case", "serial-comma",
]
line_length = 78
proper_nouns = [
  "Peios", "GXWI", "Registry Editor", "Linux", "Windows", "Microsoft",
  "Microsoft Open Specifications", "Core Style", "Word List",
  "regman", "evman", "netd", "peinit", "authd",
]

# The shelf title uses the requested "Technical Writing & Documentation" name.
[[lint.ignore]]
path = "4--standards-and-conventions.shelf/psc.product/1--technical-writing-and-documentation.shelf/trail.toml"
rules = ["ampersand"]

# These pages quote every word they ban.
[[lint.ignore]]
path = "4--standards-and-conventions.shelf/psc.product/1--technical-writing-and-documentation.shelf/2--style.topic/100--core-style.md"
rules = ["spelling"]

[[lint.ignore]]
path = "4--standards-and-conventions.shelf/psc.product/1--technical-writing-and-documentation.shelf/2--style.topic/200--word-list.md"
rules = ["spelling"]

# The conventions book writes hashes and byte sequences in lowercase hex
# (its §3.3).
[[lint.ignore]]
path = "4--standards-and-conventions.shelf/psc.product/1--technical-writing-and-documentation.shelf/3--conventions.book"
rules = ["hex-case"]

[lint.spelling]
banned-words = ["banned-words.txt"]
