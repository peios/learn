name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Outside the checkout on purpose: this repository's root is also
      # the site root, where trail accepts only trail.toml and *.product
      # directories — a binary sitting there fails the build.
      - name: Download Trail
        run: |
          curl -sL https://github.com/peios/trail/releases/latest/download/trail-linux-amd64 \
            -o "$RUNNER_TEMP/trail"
          chmod +x "$RUNNER_TEMP/trail"

      # Files trail does not build — .well-known, and anything else the
      # site config lists as passthrough — are copied in by the build
      # itself, so there is no post-build step to keep in sync.
      - name: Build site
        run: "$RUNNER_TEMP/trail" build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - id: deployment
        uses: actions/deploy-pages@v4
