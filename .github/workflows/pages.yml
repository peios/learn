name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Outside the checkout on purpose: this repository's root is also
      # the site root, where trail accepts only trail.toml and *.product
      # directories — a binary sitting there fails the build.
      - name: Download Trail
        run: |
          curl -sL https://github.com/peios/trail/releases/latest/download/trail-linux-amd64 \
            -o "$RUNNER_TEMP/trail"
          chmod +x "$RUNNER_TEMP/trail"

      # Files trail does not build — .well-known, and anything else the
      # site config lists as passthrough — are copied in by the build
      # itself, so there is no post-build step to keep in sync.
      #
      # --strict fails the build on an article with no description:, which
      # is what search engines and chat apps show for the page. Every
      # article has one; this is what keeps that true.
      #
      # --cbpath publishes a second copy of the whole site under the
      # commit's short hash, with every link inside it rewritten to stay
      # there. Pages sets its own cache headers and we cannot override
      # them, so learn.peios.org/<sha>/ is the only URL guaranteed to be
      # this build — which is what an agent's web fetcher needs. The copy
      # is noindex and out of the sitemap; /cb in the search box reaches
      # it. On a push GITHUB_SHA is the commit checkout just built, so
      # the path and the content cannot disagree.
      - name: Build site
        run: |
          "$RUNNER_TEMP/trail" build --strict --cbpath "${GITHUB_SHA::8}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - id: deployment
        uses: actions/deploy-pages@v4
