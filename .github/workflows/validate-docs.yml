name: Validate documentation pull requests

on:
  pull_request:

# Build proposed documentation without access to Pages deployment or secrets.
permissions:
  contents: read

concurrency:
  group: docs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  strict-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download and verify Trail
        shell: bash
        env:
          TRAIL_URL: https://github.com/peios/trail/releases/download/latest/trail-linux-amd64
          TRAIL_SHA256: a84799039de3088177fddeee213f27a072f71c84070a9ccd957263abb7a7c5a1
        run: |
          set -euo pipefail
          # Verified Latest Build from 2026-10-06 (source 1d94ff5).
          # The upstream "latest" tag is mutable. A replacement must fail this
          # checksum until its new digest is deliberately reviewed here.
          # Keep the binary outside the repository: its root is the Trail site.
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --retry 3 --max-time 120 "$TRAIL_URL" -o "$RUNNER_TEMP/trail"
          printf '%s  %s\n' "$TRAIL_SHA256" "$RUNNER_TEMP/trail" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/trail"
          "$RUNNER_TEMP/trail" --version

      - name: Build documentation with strict checks
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trail" build --strict --out "$RUNNER_TEMP/trail-site"
