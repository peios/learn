name: Validate documentation pull requests

on:
  pull_request:

# Build proposed documentation without access to Pages deployment or secrets.
permissions:
  contents: read

concurrency:
  group: docs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  strict-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keep sibling source checkouts separate: each repository root is a Trail site.
      # The default pull_request checkout is the event's proposed merge commit.
      - name: Check out the proposed merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: proposed
          persist-credentials: false

      - name: Check out the exact pull-request event base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false

      - name: Test the rendered-link checker
        working-directory: proposed
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Download and verify Trail
        shell: bash
        env:
          TRAIL_URL: https://github.com/peios/trail/releases/download/latest/trail-linux-amd64
          TRAIL_SHA256: a84799039de3088177fddeee213f27a072f71c84070a9ccd957263abb7a7c5a1
        run: |
          set -euo pipefail
          # Verified Latest Build from 2026-10-06 (source 1d94ff5).
          # The upstream "latest" tag is mutable. A replacement must fail this
          # checksum until its new digest is deliberately reviewed here.
          # Keep the binary outside the repository: its root is the Trail site.
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --retry 3 --max-time 120 "$TRAIL_URL" -o "$RUNNER_TEMP/trail"
          printf '%s  %s\n' "$TRAIL_SHA256" "$RUNNER_TEMP/trail" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/trail"
          "$RUNNER_TEMP/trail" --version

      - name: Build documentation with strict checks
        working-directory: proposed
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trail" build --strict --out "$RUNNER_TEMP/trail-site"

      - name: Build the exact event base with the same Trail binary
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trail" build --strict --out "$RUNNER_TEMP/trail-base-site"

      - name: Reject newly broken rendered local links
        working-directory: proposed
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/scripts/check_rendered_links.py \
            "$RUNNER_TEMP/trail-base-site" "$RUNNER_TEMP/trail-site"
