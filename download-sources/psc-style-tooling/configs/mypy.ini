[mypy]
python_version = 3.11
disallow_untyped_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
show_error_codes = True
pretty = False
exclude = (^|/)(vendor|generated|node_modules|build|dist|\.venv)/
# Set source roots and third-party stubs in each component's configuration.
# Do not globally ignore missing imports or enable unrelated strict-mode rules.
